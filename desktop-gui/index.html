<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Privacy Storage Toolchain</title>
    <style>
        body { background: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        button { padding: 15px 30px; font-size: 18px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>🛡️ 个人隐私文件管理系统</h1>
    <p>基于端侧加密与多云盘映射的安全工具链</p>
    <br>
    <button id="testBtn">一键测试调用</button>
    <p id="status" style="margin-top: 20px; color: #86efac;"></p>

    <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
        document.getElementById('status').innerText = "正在调用底层引擎...";
        const res = await window.pst.testEngine();
        if (!res.ok) {
            document.getElementById('status').innerText = "调用失败: " + res.error;
            return;
        }
        document.getElementById('status').innerText = "✅ 底层引擎调用成功！";
        console.log(res.output);
    });
</script>
</body>
</html>
