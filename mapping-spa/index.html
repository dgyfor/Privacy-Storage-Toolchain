<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三盘映射器</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input[type="text"], select { padding: 6px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  input[type="text"] { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; word-break: break-all; }
  th { background: #fafafa; font-weight: 600; }
  tr:hover { background: #f9f9f9; }
  .empty { color: #999; text-align: center; padding: 40px 0; }
  .cloud-tag { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 2px 6px; border-radius: 3px; font-size: 12px; margin: 2px 2px 2px 0; }
  .muted { color: #999; }
  .status { font-size: 13px; color: #666; margin-left: auto; }
  code { font-family: Consolas, Menlo, monospace; font-size: 12px; color: #333; }
</style>
</head>
<body>

<h1>三盘映射器</h1>

<div class="toolbar">
  <input type="file" id="fileInput" accept=".jsonl,.json,.txt">
  <input type="text" id="search" placeholder="搜原文件名 / 加密名">
  <select id="cloudFilter">
    <option value="">全部云盘</option>
  </select>
  <span class="status" id="status">未加载</span>
</div>

<table>
  <thead>
    <tr>
      <th>原文件名</th>
      <th>加密名</th>
      <th>相对路径</th>
      <th>云盘</th>
      <th>大小</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="5" class="empty">先选 index.jsonl 文件</td></tr>
  </tbody>
</table>

<script>
var records = [];

document.getElementById("fileInput").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    parseJSONL(ev.target.result);
    render();
  };
  reader.readAsText(file, "utf-8");
});

document.getElementById("search").addEventListener("input", render);
document.getElementById("cloudFilter").addEventListener("change", render);

function parseJSONL(text) {
  records = [];
  var lines = text.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    try { records.push(JSON.parse(line)); }
    catch (err) { console.warn("跳过坏行:", line); }
  }
  buildCloudOptions();
  document.getElementById("status").textContent = "共 " + records.length + " 条";
}

function buildCloudOptions() {
  var names = {};
  records.forEach(function(r) {
    (r.clouds || []).forEach(function(c) {
      if (c.name) names[c.name] = true;
    });
  });
  var sel = document.getElementById("cloudFilter");
  sel.innerHTML = '<option value="">全部云盘</option>';
  Object.keys(names).sort().forEach(function(n) {
    var opt = document.createElement("option");
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
}

function render() {
  var kw = document.getElementById("search").value.trim().toLowerCase();
  var cf = document.getElementById("cloudFilter").value;
  var tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  var filtered = records.filter(function(r) {
    if (kw) {
      var a = (r.original_name || "").toLowerCase();
      var b = (r.encrypted_name || "").toLowerCase();
      if (a.indexOf(kw) === -1 && b.indexOf(kw) === -1) return false;
    }
    if (cf) {
      var has = (r.clouds || []).some(function(c) { return c.name === cf; });
      if (!has) return false;
    }
    return true;
  });

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">没有匹配的记录</td></tr>';
    return;
  }

  filtered.forEach(function(r) {
    var tr = document.createElement("tr");
    var clouds = r.clouds || [];
    var cloudHTML = clouds.length
      ? clouds.map(function(c) {
          return '<span class="cloud-tag" title="' + escapeHtml(c.path || "") + '">' + escapeHtml(c.name || "?") + '</span>';
        }).join("")
      : '<span class="muted">—</span>';
    tr.innerHTML =
      "<td>" + escapeHtml(r.original_name || "") + "</td>" +
      "<td><code>" + escapeHtml(r.encrypted_name || "") + "</code></td>" +
      "<td>" + escapeHtml(r.relative_path || "") + "</td>" +
      "<td>" + cloudHTML + "</td>" +
      "<td>" + formatSize(r.sizes && r.sizes.encrypted) + "</td>";
    tbody.appendChild(tr);
  });
}

function formatSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
</script>

</body>
</html>
