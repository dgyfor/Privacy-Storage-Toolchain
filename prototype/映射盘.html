        // === 修改点4：handleConfigFile 重写支持多文件 ===
        async function handleConfigFile(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            // 重置状态
            wizardState.uploadFileNames = [];
            wizardState.configParsed = null;

            let allMappings = [];
            let baseDisk1 = null;
            let baseDisk2 = null;
            let baseLocalPath = null;
            let baseCloudPath = null;
            let firstFile = true;
            let hasValidFile = false;
            let errorCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const text = await file.text();
                    const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    if (lines.length < 3) {
                        showToast('文件 ' + file.name + ' 格式错误：至少需要3行', 'error');
                        errorCount++;
                        continue;
                    }

                    // 解析映射
                    let mappings = [];
                    for (let j = 2; j < lines.length; j++) {
                        const line = lines[j];
                        const mainParts = line.split('↔').map(s => s.trim());
                        if (mainParts.length !== 2) continue;
                        const left = mainParts[0];
                        let right = mainParts[1];
                        let size = 0;
                        const pipeIdx = right.indexOf('|');
                        if (pipeIdx !== -1) {
                            const encPart = right.substring(0, pipeIdx).trim();
                            const sizePart = right.substring(pipeIdx + 1).trim();
                            size = parseInt(sizePart, 10);
                            if (isNaN(size)) size = 0;
                            right = encPart;
                        }
                        mappings.push({ from: left, to: right, size: size });
                    }

                    if (mappings.length === 0) {
                        showToast('文件 ' + file.name + ' 未解析到有效的映射关系', 'warning');
                        errorCount++;
                        continue;
                    }

                    const line2 = lines[1];
                    const pathParts = line2.split(',').map(s => s.trim());
                    if (pathParts.length !== 2) {
                        showToast('文件 ' + file.name + ' 第二行需要两个路径，用逗号分隔', 'error');
                        errorCount++;
                        continue;
                    }

                    let localPath = pathParts[0];
                    const prefixToRemove = "/storage/emulated/0/ 我的文件/爱-加密仓库/加密文件";
                    if (localPath.startsWith(prefixToRemove)) {
                        localPath = localPath.substring(prefixToRemove.length);
                        localPath = localPath.replace(/^\/+/, '');
                    }
                    if (localPath === '') localPath = '.';
                    const cloudPath = pathParts[1];

                    const diskParts = lines[0].split(',').map(s => s.trim());
                    const disk1 = diskParts[0] || 'local';
                    const disk2 = diskParts[1] || 'cloudA';

                    if (firstFile) {
                        baseDisk1 = disk1;
                        baseDisk2 = disk2;
                        baseLocalPath = localPath;
                        baseCloudPath = cloudPath;
                        firstFile = false;
                    } else {
                        if (disk1 !== baseDisk1 || disk2 !== baseDisk2 ||
                            localPath !== baseLocalPath || cloudPath !== baseCloudPath) {
                            showToast('⚠️ 文件 ' + file.name + ' 的盘名或路径与第一个文件不一致，将忽略其盘名和路径', 'info');
                        }
                    }

                    allMappings = allMappings.concat(mappings);
                    wizardState.uploadFileNames.push(file.name);
                    hasValidFile = true;

                } catch (err) {
                    showToast('解析文件 ' + file.name + ' 失败: ' + err.message, 'error');
                    errorCount++;
                }
            }

            if (!hasValidFile || allMappings.length === 0 || baseDisk1 === null) {
                if (errorCount === files.length) {
                    showToast('❌ 所有文件解析失败，请检查格式', 'error');
                } else {
                    showToast('未解析到任何有效的映射关系', 'error');
                }
                renderWizardStep();
                event.target.value = '';
                return;
            }

            // 去重（基于 from→to）
            const uniqueMappings = [];
            const seen = new Set();
            allMappings.forEach(m => {
                const key = m.from + '|' + m.to;
                if (!seen.has(key)) {
                    seen.add(key);
                    uniqueMappings.push(m);
                }
            });

            const dupCount = allMappings.length - uniqueMappings.length;

            // 应用配置
            const localTreeId = 'local';
            let cloudTreeId = 'cloudA';
            if (baseDisk2.includes('光鸭') || baseDisk2.includes('光鸭盘')) {
                cloudTreeId = 'cloudB';
            }

            const cleanPath = (p) => p.replace(/^\/+|\/+$/g, '').split('/').filter(s => s.length > 0);
            const localDirs = cleanPath(baseLocalPath);
            const cloudDirs = cleanPath(baseCloudPath);

            // 内部辅助函数
            function getOrCreateDir(treeId, dirs) {
                let tree = data.trees[treeId];
                if (!tree) return null;
                let currentNodes = tree.nodes;
                let currentNode = null;
                for (let d of dirs) {
                    let found = currentNodes.find(n => n.name === d && n.type === 'folder');
                    if (!found) {
                        const newDir = {
                            id: 'n' + (data.nextId++),
                            name: d,
                            type: 'folder',
                            size: 0,
                            createTime: Date.now(),
                            children: []
                        };
                        currentNodes.push(newDir);
                        found = newDir;
                    }
                    currentNodes = found.children;
                    currentNode = found;
                }
                return currentNode;
            }

            function getOrCreateFile(treeId, parentDirNode, fileName, fileSize) {
                let tree = data.trees[treeId];
                if (!tree) return null;
                let parent = parentDirNode || null;
                let nodes = parent ? parent.children : tree.nodes;
                let existing = nodes.find(n => n.name === fileName && n.type === 'file');
                if (existing) {
                    if (fileSize !== undefined && fileSize > 0) existing.size = fileSize;
                    return existing;
                }
                const newFile = {
                    id: 'n' + (data.nextId++),
                    name: fileName,
                    type: 'file',
                    size: fileSize || 0,
                    createTime: Date.now()
                };
                nodes.push(newFile);
                return newFile;
            }

            let localParent = getOrCreateDir(localTreeId, localDirs);
            let cloudParent = getOrCreateDir(cloudTreeId, cloudDirs);
            let successCount = 0;
            for (let m of uniqueMappings) {
                const localFile = getOrCreateFile(localTreeId, localParent, m.from, m.size);
                const cloudFile = getOrCreateFile(cloudTreeId, cloudParent, m.to, 0);
                if (!localFile || !cloudFile) continue;
                const exists = data.links.some(link =>
                    (link.source.treeId === localTreeId && link.source.nodeId === localFile.id &&
                        link.target.treeId === cloudTreeId && link.target.nodeId === cloudFile.id) ||
                    (link.source.treeId === cloudTreeId && link.source.nodeId === cloudFile.id &&
                        link.target.treeId === localTreeId && link.target.nodeId === localFile.id)
                );
                if (!exists) {
                    data.links.push({
                        id: 'l' + (data.nextId++),
                        source: { treeId: localTreeId, nodeId: localFile.id },
                        target: { treeId: cloudTreeId, nodeId: cloudFile.id }
                    });
                    successCount++;
                }
            }

            // 存储解析结果供预览
            wizardState.configParsed = {
                disk1: baseDisk1,
                disk2: baseDisk2,
                localPath: baseLocalPath,
                cloudPath: baseCloudPath,
                mappings: uniqueMappings
            };

            saveState();
            renderCurrentTree();

            let msg = '✅ 成功导入并建立 ' + successCount + ' 个映射';
            if (dupCount > 0) msg += '（去重 ' + dupCount + ' 个重复项）';
            if (files.length > 1) msg += '，合并 ' + files.length + ' 个文件';
            showToast(msg, 'success');

            // 重新渲染向导步骤以显示最新状态
            renderWizardStep();
            event.target.value = '';
        }

            html2 += `</div>`;
            html2 += `<div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;">
                <button onclick="wizardSelectAll('${role}')" style="padding:2px 10px;border:none;border-radius:12px;background:#1e3a8a;color:#93c5fd;font-size:11px;cursor:pointer;">全选</button>
                <button onclick="wizardClearAll('${role}')" style="padding:2px 10px;border:none;border-radius:12px;background:#334155;color:#e2e8f0;font-size:11px;cursor:pointer;">清空</button>
                <span style="font-size:10px;color:#94a3b8;margin-left:4px;">${isLocal ? '选择本地盘文件' : '选择目标盘文件'}</span>
            </div></div>`;
            return html2;
        }

        function toggleFileSelection(role, nodeId) {
            const isLocal = role === 'local';
            const treeId = isLocal ? 'local' : wizardState.targetDisk;
            if (!treeId) return;
            const node = getNode(treeId, nodeId);
            if (!node || node.type === 'folder') return;
            const arr = isLocal ? wizardState.localSelected : wizardState.targetSelected;
            const idx = arr.indexOf(nodeId);
            if (idx > -1) arr.splice(idx, 1);
            else arr.push(nodeId);
            renderWizardStep();
        }

        function navigateWizardDir(role, dirId) {
            const isLocal = role === 'local';
            const treeId = isLocal ? 'local' : wizardState.targetDisk;
            if (!treeId) return;
            if (dirId) {
                const node = getNode(treeId, dirId);
                if (!node || node.type !== 'folder') return;
                if (isLocal) wizardState.localDirId = dirId;
                else wizardState.targetDirId = dirId;
            } else {
                if (isLocal) {
                    const path = getNodePath(treeId, wizardState.localDirId);
                    if (path && path.length > 1) wizardState.localDirId = path[path.length - 2].id;
                    else wizardState.localDirId = null;
                } else {
                    const path = getNodePath(treeId, wizardState.targetDirId);
                    if (path && path.length > 1) wizardState.targetDirId = path[path.length - 2].id;
                    else wizardState.targetDirId = null;
                }
            }
            renderWizardStep();
        }

        function wizardSelectAll(role) {
            const isLocal = role === 'local';
            const treeId = isLocal ? 'local' : wizardState.targetDisk;
            if (!treeId) return;
            const dirId = isLocal ? wizardState.localDirId : wizardState.targetDirId;
            const tree = data.trees[treeId];
            let nodes = tree.nodes;
            if (dirId) {
                const dirNode = getNode(treeId, dirId);
                if (dirNode && dirNode.type === 'folder') nodes = dirNode.children || [];
            }
            const arr = isLocal ? wizardState.localSelected : wizardState.targetSelected;
            nodes.forEach(node => {
                if (node.type === 'file' && !arr.includes(node.id)) arr.push(node.id);
            });
            renderWizardStep();
        }

        function wizardClearAll(role) {
            const isLocal = role === 'local';
            const arr = isLocal ? wizardState.localSelected : wizardState.targetSelected;
            arr.length = 0;
            renderWizardStep();
        }

        function renderPairConfig() {
            const localSelected = wizardState.localSelected;
            const targetSelected = wizardState.targetSelected;
            if (localSelected.length === 0 || targetSelected.length === 0) {
                return `<div style="text-align:center;padding:12px;color:#94a3b8;">
                    <div style="font-size:32px;">⚠️</div>
                    <div style="font-size:13px;">请先在两侧各选择至少一个文件</div>
                    <div style="font-size:11px;margin-top:2px;">本地已选: ${localSelected.length}，目标已选: ${targetSelected.length}</div>
                </div>`;
            }
            const pairs = [];
            const localNodes = localSelected.map(id => getNode('local', id)).filter(Boolean);
            const targetNodes = targetSelected.map(id => getNode(wizardState.targetDisk, id)).filter(Boolean);
            const maxLen = Math.min(localNodes.length, targetNodes.length);
            for (let i = 0; i < maxLen; i++) {
                pairs.push({ left: localNodes[i], right: targetNodes[i] });
            }
            let html = `<div style="margin-bottom:4px;font-size:11px;color:#94a3b8;">
                本地 ${localNodes.length} 个，目标 ${targetNodes.length} 个
                ${localNodes.length !== targetNodes.length ? '<span style="color:#fcd34d;"> ⚠️ 数量不匹配，按较小数量配对</span>' : ''}
            </div>`;
            if (pairs.length === 0) {
                html += `<div style="text-align:center;padding:12px;color:#64748b;">没有可配对的项</div>`;
                return html;
            }
            html += `<div class="pair-list">`;
            pairs.forEach((pair, idx) => {
                html += `<div class="pair-row">
                    <div class="pair-left" onclick="selectSwap('left', ${idx})">${pair.left ? pair.left.name : '(空)'}</div>
                    <span class="pair-arrow">↔</span>
                    <div class="pair-right" onclick="selectSwap('right', ${idx})">${pair.right ? pair.right.name : '(空)'}</div>
                </div>`;
            });
            html += `</div>`;
            html +=
                `<div style="font-size:10px;color:#94a3b8;margin-top:2px;">💡 点击左侧或右侧可互换配对顺序</div>`;
            wizardState.pairs = pairs;
            return html;
        }

        function selectSwap(side, index) {
            const pairs = wizardState.pairs;
            if (index < 0 || index >= pairs.length) return;
            if (side === 'left') {
                if (index > 0) {
                    const temp = pairs[index].left;
                    pairs[index].left = pairs[index - 1].left;
                    pairs[index - 1].left = temp;
                }
            } else {
                if (index < pairs.length - 1) {
                    const temp = pairs[index].right;
                    pairs[index].right = pairs[index + 1].right;
                    pairs[index + 1].right = temp;
                }
            }
            renderWizardStep();
        }

        function renderPreview() {
            const pairs = wizardState.pairs;
            if (pairs.length === 0) {
                return `<div style="text-align:center;padding:12px;color:#94a3b8;">没有映射关系</div>`;
            }
            let html = `<div class="preview-list">`;
            pairs.forEach((pair, idx) => {
                const leftName = pair.left ? pair.left.name : '(空)';
                const rightName = pair.right ? pair.right.name : '(空)';
                html += `<div class="preview-item">
                    <span class="preview-left">${leftName}</span>
                    <span style="color:#64748b;font-size:11px;"> ↔ </span>
                    <span class="preview-right">${rightName}</span>
                </div>`;
            });
            html += `</div>`;
            html +=
                `<div style="margin-top:4px;font-size:11px;color:#94a3b8;">即将建立 ${pairs.length} 对映射关系</div>`;
            return html;
        }

        function mapWizardPrev() {
            if (wizardState.step > 0) {
                wizardState.step--;
                if (wizardState.step === 0 && wizardState.mode === 'upload') {
                    wizardState.mode = null;
                }
                renderWizardStep();
            }
        }

        function mapWizardNext() {
            const step = wizardState.step;
            if (step === 0 && !wizardState.mode) {
                showToast('请选择一种模式', 'error');
                return;
            }
            if (step === 1 && wizardState.mode === 'manual' && !wizardState.targetDisk) {
                showToast('请选择目标云盘', 'error');
                return;
            }
            if (step === 2) {
                if (wizardState.localSelected.length === 0) {
                    showToast('请至少选择一个本地文件', 'error');
                    return;
                }
            }
            if (step === 3) {
                if (wizardState.targetSelected.length === 0) {
                    showToast('请至少选择一个目标盘文件', 'error');
                    return;
                }
            }
            if (step === 4) {
                const localNodes = wizardState.localSelected.map(id => getNode('local', id)).filter(Boolean);
                const targetNodes = wizardState.targetSelected.map(id => getNode(wizardState.targetDisk, id)).filter(
                Boolean);
                const pairs = [];
                const maxLen = Math.min(localNodes.length, targetNodes.length);
                for (let i = 0; i < maxLen; i++) {
                    pairs.push({ left: localNodes[i], right: targetNodes[i] });
                }
                if (pairs.length === 0) {
                    showToast('没有可配对的项', 'error');
                    return;
                }
                wizardState.pairs = pairs;
            }
            if (step === 5) {
                confirmMapWizard();
                return;
            }
            if (step === 1 && wizardState.mode === 'upload') {
                if (!wizardState.configParsed) {
                    showToast('请上传并解析配置文件', 'error');
                    return;
                }
                closeMapWizard();
                return;
            }
            if (step < 5) {
                wizardState.step++;
                renderWizardStep();
            }
        }

        function confirmMapWizard() {
            const pairs = wizardState.pairs;
            if (pairs.length === 0) {
                showToast('没有映射关系可建立', 'error');
                return;
            }
            const targetTreeId = wizardState.targetDisk;
            if (!targetTreeId) {
                showToast('目标云盘无效', 'error');
                return;
            }
            let added = 0;
            pairs.forEach(pair => {
                if (!pair.left || !pair.right) return;
                const exists = data.links.some(link =>
                    (link.source.treeId === 'local' && link.source.nodeId === pair.left.id &&
                        link.target.treeId === targetTreeId && link.target.nodeId === pair.right.id) ||
                    (link.source.treeId === targetTreeId && link.source.nodeId === pair.right.id &&
                        link.target.treeId === 'local' && link.target.nodeId === pair.left.id)
                );
                if (!exists) {
                    data.links.push({
                        id: 'l' + (data.nextId++),
                        source: { treeId: 'local', nodeId: pair.left.id },
                        target: { treeId: targetTreeId, nodeId: pair.right.id }
                    });
                    added++;
                }
            });
            saveState();
            renderCurrentTree();
            closeMapWizard();
            showToast('✅ 成功建立 ' + added + ' 个映射', 'success');
        }

        // ============================================================
        //  导入导出（带确认）
        // ============================================================
        function exportData() {
            if (!confirm('确定要导出当前数据为备份文件吗？')) {
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '三盘映射备份_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('📤 导出成功', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.trees && imported.links !== undefined) {
                        if (confirm('导入将覆盖当前数据，确定继续吗？')) {
                            data = imported;
                            TREE_IDS.forEach(id => {
                                if (!data.trees[id]) data.trees[id] = { id: id, label: DEFAULT_LABELS[id],
                                    nodes: [], currentDir: null };
                            });
                            if (!data.selectedNodes) data.selectedNodes = [];
                            data.multiMode = false;
                            data.movingMode = false;
                            if (!data.sortKey) data.sortKey = 'name-asc';
                            data.currentTreeId = data.currentTreeId || 'local';
                            fixNextId();
                            saveState();
                            renderCurrentTree();
                            showToast('✅ 导入成功！', 'success');
                        }
                    } else showToast('❌ 无效的备份文件', 'error');
                } catch (err) { showToast('❌ 解析失败', 'error'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  初始化
        // ============================================================
        if (!loadState()) {
            initDemo();
        } else {
            let hasNodes = false;
            TREE_IDS.forEach(id => {
                if (data.trees[id] && data.trees[id].nodes && data.trees[id].nodes.length > 0) hasNodes = true;
            });
            if (!hasNodes) {
                initDemo();
            }
        }

        initEvents();
        updateTabs();
        updateBackBtn();
        updateTitlePath();
        updateSortMenu();
        renderCurrentTree();

        window.addEventListener('beforeunload', function() { if (_longPressTimer) clearTimeout(_longPressTimer); });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ Service Worker 注册成功'))
                .catch(err => console.log('❌ Service Worker 注册失败:', err));
        }
    </script>
</body>
</html>
